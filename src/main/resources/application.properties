spring.application.name=restaurant

# Datasource — defaults can be overridden with environment variables (useful for docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=restaurant_user
spring.datasource.password=restaurant_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use UTC for timestamps unless otherwise configured
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


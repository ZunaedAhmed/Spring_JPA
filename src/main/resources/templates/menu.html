<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container container-main py-4">
      <h3>Menu</h3>
      <a class="btn btn-primary mb-3" th:href="@{/}">Back</a>
      <div class="row">
        <div class="col-md-4 mb-3" th:each="item : ${menuItems}">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title" th:text="${item.name}">Name</h5>
              <p class="card-text" th:text="${item.category != null ? item.category.name : 'Uncategorized'}">Category</p>
              <p class="fw-bold" th:text="${#numbers.formatDecimal(item.price,1,2)}">$0.00</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

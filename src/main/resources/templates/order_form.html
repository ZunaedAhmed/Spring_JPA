<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container container-main py-4">
      <h3>Create Order</h3>
      <a class="btn btn-link mb-3" th:href="@{/}">Back</a>

      <form th:action="@{/orders/new}" th:object="${orderForm}" method="post">
        <div class="mb-3">
          <label class="form-label">Customer</label>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{customerId}" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Table (optional)</label>
          <select name="tableId" class="form-select" th:field="*{tableId}">
            <option value="" selected>-- none --</option>
            <option th:each="t : ${tables}" th:value="${t.tableId}" th:text="'Table ' + ${t.tableId}"></option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Order Type</label>
          <select name="orderType" class="form-select">
            <option value="DINE_IN">DINE_IN</option>
            <option value="TAKEOUT">TAKEOUT</option>
            <option value="DELIVERY">DELIVERY</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Items</label>
          <div class="list-group">
            <div class="list-group-item" th:each="mi,iterStat : ${menuItems}">
              <div class="row align-items-center">
                <div class="col-auto">
                  <input type="checkbox" th:name="itemIds" th:field="*{itemIds}" th:value="${mi.menuItemId}" th:id="${'item-'+iterStat.index}" />
                </div>
                <div class="col">
                  <label th:for="${'item-'+iterStat.index}" class="mb-0" th:text="${mi.name}">Name</label>
                  <div class="text-muted" th:text="${#numbers.formatDecimal(mi.price,1,2)}">$0.00</div>
                </div>
                <div class="col-auto">
                  <input type="number" min="1" value="1" th:name="quantities" class="form-control" style="width:80px;" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" type="submit">Create Order</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

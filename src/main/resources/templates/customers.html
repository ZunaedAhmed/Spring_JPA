<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container container-main py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0">Customers</h3>
        <div>
          <a class="btn btn-success me-2" th:href="@{/customers/new}">New Customer</a>
          <a class="btn btn-primary" th:href="@{/}">Back</a>
        </div>
      </div>
      <table class="table table-striped">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th></tr>
        </thead>
        <tbody>
          <tr th:each="c : ${customers}">
            <td th:text="${c.customerId}">1</td>
            <td th:text="${c.name}">Name</td>
            <td th:text="${c.phone}">Phone</td>
            <td th:text="${c.email}">Email</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Menu Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container container-main py-4">
      <h3>Create Menu Item</h3>
      <a class="btn btn-link mb-3" th:href="@{/menu}">Back</a>

      <form th:action="@{/menu/new}" th:object="${menuItem}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" type="text" th:field="*{name}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Price</label>
          <input class="form-control" type="number" step="0.01" th:field="*{price}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" th:field="*{status}">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="categoryId">
            <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.name}">Cat</option>
          </select>
        </div>

        <button class="btn btn-primary" type="submit">Create Menu Item</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

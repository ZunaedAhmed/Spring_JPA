<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top border-bottom">
      <div class="container container-main">
        <a class="navbar-brand" href="#">Restaurant</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/menu}">Menu</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Customers</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/orders/new}">New Order</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container container-main">
      <div class="row gy-4">
        <div class="col-12">
          <div class="card p-4">
            <h3 class="mb-3">Menu Highlights</h3>
            <div class="row">
              <div class="col-md-4" th:each="item : ${menuItems}">
                <div class="card mb-3">
                  <div class="card-body">
                    <h5 class="card-title" th:text="${item.name}">Item name</h5>
                    <p class="card-text text-muted" th:text="${item.category != null ? item.category.name : 'Uncategorized'}">Category</p>
                    <p class="fw-bold" th:text="${#numbers.formatDecimal(item.price,1,2)}">$0.00</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="card p-3">
            <h5>Recent Customers</h5>
            <table class="table mt-2">
              <thead>
                <tr><th>Name</th><th>Phone</th><th>Email</th></tr>
              </thead>
              <tbody>
                <tr th:each="c : ${customers}">
                  <td th:text="${c.name}">Name</td>
                  <td th:text="${c.phone}">Phone</td>
                  <td th:text="${c.email}">Email</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="card p-3">
            <h5>Tables</h5>
            <table class="table mt-2">
              <thead>
                <tr><th>Table</th><th>Seats</th><th>Status</th></tr>
              </thead>
              <tbody>
                <tr th:each="t : ${tables}">
                  <td th:text="${t.tableId}">1</td>
                  <td th:text="${t.seats}">4</td>
                  <td th:text="${t.status}">FREE</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer text-center mt-5">
      <div class="container container-main">© Restaurant</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

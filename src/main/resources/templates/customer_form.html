<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container container-main py-4">
      <h3>Create Customer</h3>
      <a class="btn btn-link mb-3" th:href="@{/customers}">Back</a>

      <form th:action="@{/customers/new}" th:object="${customer}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" type="text" th:field="*{name}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input class="form-control" type="text" th:field="*{phone}" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" th:field="*{email}" />
        </div>

        <button class="btn btn-primary" type="submit">Create Customer</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
